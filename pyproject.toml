[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-sales-data-automation"
version = "0.1.0"
description = "Normalize synthetic multi-channel EC sales CSVs and prepare an auditable sales report."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
ec-sales = "ec_sales.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
