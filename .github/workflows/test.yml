name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application
        run: python -m pip install '.[app]'
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Portable sample
        run: |
          ec-sales --input sample_data/input --output output --contract config/source_contracts.json
          python -c 'import json; q=json.load(open("output/quality_report.json")); assert q["reconciliation_ok"]'
      - name: Streamlit startup smoke test
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 &
          app_pid=$!
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl --fail http://localhost:8501/_stcore/health
          kill "$app_pid"
